# ═══════════════════════════════════════════════════════════════
# Bangkok Watch — Configuration (modèle)
# Vacances Zone A (Lyon) 2026-2027 — dates officielles
#
# Copier en config.yml. config.yml est gitignored : il est écrit par la page
# Admin et ne doit jamais être écrasé par un déploiement.
# ═══════════════════════════════════════════════════════════════

# Aéroports de départ
origins: [CDG, LYS, BSL, GVA, MXP]

# Destinations Thaïlande
# BKK Suvarnabhumi, HKT Phuket, CNX Chiang Mai
destinations: [BKK, HKT, CNX]

# Devise principale (ce que tu paies au final depuis la France)
currency: EUR

adults: 1
children: [9, 11]  # âges des enfants (anniversaires en septembre)
max_fly_duration_hours: 18

# Cron pour le scheduler interne (timezone Europe/Paris)
# "0 7,19 * * *" = 2x par jour à 7h et 19h
# "0 */6 * * *" = toutes les 6 heures
# "0 * * * *"   = toutes les heures
# Attention : chaque run parcourt origines × destinations × dates aller × dates
# retour côté Duffel, et lance un Chromium par hôtel. Plus le cron est fréquent,
# plus les runs risquent de se chevaucher.
schedule_cron: "0 */6 * * *"

rolling_window_days: 14
rise_threshold_pct: 0.10  # alerte hausse si +10% vs bas 7 derniers jours

# ─── ntfy ──────────────────────────────────────────────────────
# LE TOPIC EST UN SECRET. Sur ntfy.sh, un topic non réservé est ouvert en
# lecture ET en écriture à quiconque connaît son nom : il peut lire toutes tes
# alertes en temps réel et t'envoyer de fausses notifications (y compris avec
# un lien cliquable vers l'URL de son choix). NTFY_TOKEN ne protège que
# l'émission, pas la lecture.
# Génère un nom long et aléatoire, par exemple :  openssl rand -hex 16
# Ne le committe jamais, et ne le partage pas avec un autre usage.
ntfy:
  server: https://ntfy.sh
  topic: CHANGE-MOI-chaine-aleatoire

# ─── Hôtels à surveiller (Google Hotels) ──────────────────────
# La recherche se fait par `name`, tel qu'il apparaît sur Google Hotels.
# Le champ `entity_id` est encore lu par le code mais n'est plus utilisé.
hotels:
  - name: "Chatrium Riverside Bangkok"
    checkin: "2026-10-16"
    checkout: "2026-10-19"
    price_threshold: 500  # EUR total pour le séjour
    enabled: true

# ─── Périodes à surveiller (±3j autour de chaque borne) ────────
trips:

  - name: "Toussaint 2026"
    outbound_window: ["2026-10-14", "2026-10-20"]
    return_window: ["2026-10-30", "2026-11-05"]
    price_threshold: 750

  - name: "Noël 2026"
    outbound_window: ["2026-12-16", "2026-12-22"]
    return_window: ["2027-01-01", "2027-01-07"]
    price_threshold: 900

  - name: "Hiver 2027"
    outbound_window: ["2027-02-10", "2027-02-16"]
    return_window: ["2027-02-26", "2027-03-04"]
    price_threshold: 800

  - name: "Printemps 2027"
    outbound_window: ["2027-04-07", "2027-04-13"]
    return_window: ["2027-04-23", "2027-04-29"]
    price_threshold: 800

  - name: "Été 2027 (2-3 sem)"
    outbound_window: ["2027-07-03", "2027-07-20"]
    return_window: ["2027-07-20", "2027-08-15"]
    min_nights: 14
    max_nights: 24
    price_threshold: 850
