# ═══════════════════════════════════════════════════════════════
# Bangkok Watch — Configuration (modèle)
# Vacances Zone A (Lyon) 2026-2027 — dates officielles
#
# Copier en config.yml. config.yml est gitignored : il est écrit par la page
# Admin et ne doit jamais être écrasé par un déploiement.
# ═══════════════════════════════════════════════════════════════

# Aéroports de départ
origins: [CDG, LYS, BSL, GVA, MXP]

# Destinations Thaïlande
# BKK Suvarnabhumi, HKT Phuket, CNX Chiang Mai
destinations: [BKK, HKT, CNX]

# Devise principale (ce que tu paies au final depuis la France)
currency: EUR

adults: 1
children: [9, 11]  # âges des enfants (anniversaires en septembre)
max_fly_duration_hours: 18

# Cron pour le scheduler interne (timezone Europe/Paris)
# "0 7,19 * * *" = 2x par jour à 7h et 19h
# "0 */6 * * *" = toutes les 6 heures
# "0 * * * *"   = toutes les heures
# Attention : chaque run parcourt origines × destinations × dates aller × dates
# retour côté Duffel, et lance un Chromium par hôtel. Plus le cron est fréquent,
# plus les runs risquent de se chevaucher.
schedule_cron: "0 */6 * * *"

rolling_window_days: 14
rise_threshold_pct: 0.10  # alerte hausse si +10% vs bas 7 derniers jours

# ─── ntfy ──────────────────────────────────────────────────────
# LE TOPIC EST UN SECRET. Sur ntfy.sh, un topic non réservé est ouvert en
# lecture ET en écriture à quiconque connaît son nom : il peut lire toutes tes
# alertes en temps réel et t'envoyer de fausses notifications (y compris avec
# un lien cliquable vers l'URL de son choix). NTFY_TOKEN ne protège que
# l'émission, pas la lecture.
# Génère un nom long et aléatoire, par exemple :  openssl rand -hex 16
# Ne le committe jamais, et ne le partage pas avec un autre usage.
ntfy:
  server: https://ntfy.sh
  topic: CHANGE-MOI-chaine-aleatoire

# ─── Hôtels à surveiller (Google Hotels) ──────────────────────
# La recherche se fait par `name`, tel qu'il apparaît sur Google Hotels.
# Le champ `entity_id` est encore lu par le code mais n'est plus utilisé.
hotels:
  - name: "Chatrium Riverside Bangkok"
    checkin: "2026-10-16"
    checkout: "2026-10-19"
    price_threshold: 500  # EUR total pour le séjour
    enabled: true

# ─── Périodes à surveiller (±3j autour de chaque borne) ────────
trips:

  - name: "Toussaint 2026"
    outbound_window: ["2026-10-14", "2026-10-20"]
    return_window: ["2026-10-30", "2026-11-05"]
    price_threshold: 750

  - name: "Noël 2026"
    outbound_window: ["2026-12-16", "2026-12-22"]
    return_window: ["2027-01-01", "2027-01-07"]
    price_threshold: 900

  - name: "Hiver 2027"
    outbound_window: ["2027-02-10", "2027-02-16"]
    return_window: ["2027-02-26", "2027-03-04"]
    price_threshold: 800

  - name: "Printemps 2027"
    outbound_window: ["2027-04-07", "2027-04-13"]
    return_window: ["2027-04-23", "2027-04-29"]
    price_threshold: 800

  - name: "Été 2027 (2-3 sem)"
    outbound_window: ["2027-07-03", "2027-07-20"]
    return_window: ["2027-07-20", "2027-08-15"]
    min_nights: 14
    max_nights: 24
    price_threshold: 850

# ─── Sondes compagnies ────────────────────────────────────────
# Interrogation directe de l'API officielle d'une compagnie, sur un
# périmètre VOLONTAIREMENT étroit calibré sur le quota de cette API.
#
# À quoi ça sert : fli couvre tout le marché mais ne sonde que la date
# médiane. Une sonde balaie progressivement la grille aller × retour
# d'une seule route et reconstruit ainsi la heatmap, perdue depuis la
# coupure de Duffel.
#
# Ce que ça n'est PAS : une source de prix de marché. Une sonde ne voit
# qu'une compagnie. Ses relevés vivent dans la table `probe_checks` et
# ne touchent ni l'état, ni la fenêtre glissante, ni les alertes.
#
# LA CLÉ N'EST PAS ICI : `key_env` ne porte que le NOM de la variable
# d'environnement (voir .env.example). Ce fichier est servi au
# navigateur par GET /api/admin/config.

# Plafond journalier PAR CREDENTIAL, pas par sonde : la clé du seau est
# le NOM DE LA VARIABLE D'ENVIRONNEMENT qui porte la clé d'API.
#
# Mesuré en production le 19/09/2026 : les hosts AF et KL d'une même clé
# Air France partagent un unique quota de 100 requêtes/jour — épuisé sur
# AF, le host KL refuse immédiatement. Une sonde KLM ampute donc la sonde
# Air France. Les erreurs 400 de validation décomptent elles aussi.
# 80 laisse la marge des run-now manuels et des retries.
quota_buckets:
  AFKL_API_KEY: 80

probes:
  - name: af-cdg-bkk
    adapter: afklm            # seul adaptateur implémenté
    travel_host: AF           # AF | KL — change la compagnie, même clé
    key_env: AFKL_API_KEY     # NOM de la variable d'env, jamais la clé
    origins: [CDG]            # 3 maximum : le quota est le facteur limitant
    destinations: [BKK]
    trips: ["Hiver 2027"]     # vide ou absent = toutes les périodes
    date_mode: grid           # grid = balayage tournant | median = date médiane
    cells_per_run: 6          # couples de dates interrogés par run
    min_interval_s: 1.2       # cadence : Air France impose 1 req/s
    cabin: ECONOMY
    # adults  = cfg.adults seulement, comparable aux autres sources
    # family  = adultes + enfants, prix réellement payé mais comparable
    #           aux seuls autres relevés de sonde
    passengers: adults
    enabled: true

  # Même clé, même seau, autre compagnie : KLM passe par son hub d'Amsterdam
  # et sort régulièrement moins cher qu'Air France sur les mêmes dates.
  # Attention, les 100 requêtes/jour sont COMMUNES aux deux sondes.
  # - name: kl-cdg-bkk
  #   travel_host: KL
  #   origins: [CDG]
  #   destinations: [BKK]
  #   trips: ["Hiver 2027"]
  #   cells_per_run: 4
  #   enabled: false
